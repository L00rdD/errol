[workspace]
resolver = "3"
members = ["crates/errol-domain", "crates/errol-data", "crates/errol-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
# let-chains (1.88), Duration::from_mins (1.91)
rust-version = "1.91"

[workspace.dependencies]
errol-domain = { path = "crates/errol-domain" }
errol-data = { path = "crates/errol-data" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
femtovg = "0.27"
glow = "0.18"
sdl2 = "0.38"

[workspace.lints.rust]
# deny, not forbid: the app crate opens the GL context, which only unsafe code can do
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# colours read better as 0xff6158 than 0x00ff_6158
unreadable_literal = "allow"
# drawing functions take a box: x, y, w, h and the rest
too_many_arguments = "allow"
too_many_lines = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
